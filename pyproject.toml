[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rubric-dpo"
version = "0.1.0"
description = "Controlled Qwen3-8B UltraFeedback baseline reproductions"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.5.1",
  "transformers==4.52.4",
  "trl==0.19.1",
  "accelerate==1.8.1",
  "datasets==3.6.0",
  "pyarrow>=15",
  "PyYAML>=6",
]

[project.scripts]
rubric-preflight = "rubric_dpo.cli.preflight:main"
rubric-prepare-ultrafeedback = "rubric_dpo.cli.prepare_ultrafeedback:main"
rubric-cache-reference = "rubric_dpo.cli.cache_reference:main"
rubric-verify-source-parity = "rubric_dpo.cli.verify:source_parity_main"
rubric-verify-reference-cache = "rubric_dpo.cli.verify:reference_cache_main"
rubric-train = "rubric_dpo.cli.train:main"
rubric-launch = "rubric_dpo.cli.launch_matrix:main"
rubric-evaluate = "rubric_dpo.cli.evaluate_local:main"
rubric-finalize-run = "rubric_dpo.cli.finalize_run:main"
rubric-seal-local-checkpoint = "rubric_dpo.cli.verify:seal_checkpoint_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
